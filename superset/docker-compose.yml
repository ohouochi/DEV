version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: superset-postgres
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
      POSTGRES_DB: superset
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - superset-network

  redis:
    image: redis:7-alpine
    container_name: superset-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - superset-network

  superset:
    image: apache/superset:3.1.0
    container_name: superset
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SUPERSET_SQLALCHEMY_DATABASE_URI: postgresql://superset:superset@postgres:5432/superset
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: QlJlkjApRxlCkGgipOnbQtVzYc2Zvnkkec1eHyj61feLMTL2QkhWUbSI
      SUPERSET_LOAD_EXAMPLES: "no"
      PYTHONUNBUFFERED: "1"
      GUNICORN_CMD_ARGS: "--timeout 120 --workers 1 --threads 2"
    ports:
      - "8088:8088"
    volumes:
      - superset_home:/app/superset_home
      - ./config/superset_config.py:/app/pythonpath/superset_config.py
    command: sh -c "superset db upgrade && superset fab create-admin --username admin --firstname Admin --lastname User --email admin@superset.local --password admin && superset init && gunicorn -w 1 -b 0.0.0.0:8088 'superset.app:create_app()'"
    networks:
      - superset-network

volumes:
  postgres_data:
  redis_data:
  superset_home:

networks:
  superset-network:
    driver: bridge
